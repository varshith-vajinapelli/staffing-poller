name: Staffing job poller

on:
  schedule:
    - cron: "7,37 * * * *"  # every 30 minutes, off GitHub's busy :00/:30 minutes
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed to save jobs.db back to the repo

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check firms and email new jobs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python poller.py

      - name: Save what was already sent
        run: |
          git config user.name "job-poller"
          git config user.email "job-poller@users.noreply.github.com"
          git add jobs.db
          git diff --cached --quiet || git commit -m "update seen jobs"
          git pull --rebase origin main
          git push
