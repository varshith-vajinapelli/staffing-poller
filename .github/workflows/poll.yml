name: Staffing job poller

on:
  workflow_dispatch:   # started every 30 minutes by cron-job.org (and the Run workflow button)

permissions:
  contents: write            # needed to save jobs.db back to the repo

# One run at a time across BOTH pollers (they share jobs.db): a run that
# starts while the other poller is still going waits for it to finish.
concurrency:
  group: jobs-db
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check firms and email new jobs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
        run: python poller.py

      - name: Save what was already sent
        run: |
          git config user.name "job-poller"
          git config user.email "job-poller@users.noreply.github.com"
          git add jobs.db
          git diff --cached --quiet || git commit -m "update seen jobs"
          # GitHub sometimes rejects a push for a moment (500 errors); try 4 times
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            echo "push failed, retrying in 15s"
            sleep 15
          done
          exit 1
