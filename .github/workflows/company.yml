name: Company job digest

on:
  workflow_dispatch:   # started at 11:52 AM and 5:52 PM Central by cron-job.org (and the Run workflow button)

permissions:
  contents: write              # needed to save jobs.db back to the repo

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check company job boards and email new jobs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python company_poller.py

      - name: Save what was already sent
        run: |
          git config user.name "job-poller"
          git config user.email "job-poller@users.noreply.github.com"
          git add jobs.db
          git diff --cached --quiet || git commit -m "update seen jobs"
          # GitHub sometimes rejects a push for a moment (500 errors); try 4 times
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            echo "push failed, retrying in 15s"
            sleep 15
          done
          exit 1
