name: Company job digest

on:
  schedule:
    - cron: "52 13,23 * * *"  # twice a day: 7:52 AM and 5:52 PM Central (times are UTC)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write              # needed to save jobs.db back to the repo

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check company job boards and email new jobs
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python company_poller.py

      - name: Save what was already sent
        run: |
          git config user.name "job-poller"
          git config user.email "job-poller@users.noreply.github.com"
          git add jobs.db
          git diff --cached --quiet || git commit -m "update seen jobs"
          git pull --rebase origin main
          git push
